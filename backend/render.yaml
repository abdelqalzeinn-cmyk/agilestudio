services:
  - type: web
    name: agilestudio
    runtime: python-3.11
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: FREELLMAPI_KEY
        sync: false
      - key: AGILESTUDIO_OWNER_EMAIL
        sync: false
      - key: AGILESTUDIO_ADMIN_API_KEY
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_ID
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_SECRET
        sync: false
      - key: ROBLOX_OAUTH_REDIRECT
        value: "https://agilestudio.onrender.com/auth/roblox/callback"
      - key: AGILESTUDIO_DB
        value: "/data/agilestudio.db"
      - key: PYTHONUNBUFFERED
        value: "1"
